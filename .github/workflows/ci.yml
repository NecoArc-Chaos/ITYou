name: Android CI & Pre-Release

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Pre-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        # 固定 v5：v6 起 Gradle 缓存组件转为专有商业许可（gradle.com/legal/terms-of-use），
        # 本项目为 MIT 开源，故停留在最后一个完全 MIT 的版本（v5 已升级至 node24）。
        # 不指定 gradle-version：交由 gradle/wrapper 决定，避免与 wrapper 版本漂移。
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully, size: $(wc -c < release.keystore) bytes"

      - name: Run Unit Tests
        run: |
          ./gradlew testDebugUnitTest \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Report Test Results
        if: always()
        run: |
          # 汇总各测试类的通过/失败数，避免测试被静默跳过（例如类名不匹配
          # 或注解缺失）时 CI 仍然显示绿灯。
          shopt -s nullglob
          files=(app/build/test-results/testDebugUnitTest/TEST-*.xml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::没有生成任何测试结果，测试可能未被执行"
            exit 1
          fi
          total=0; failed=0
          for f in "${files[@]}"; do
            t=$(grep -o 'tests="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            fl=$(grep -o 'failures="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            er=$(grep -o 'errors="[0-9]*"' "$f" | head -1 | grep -o '[0-9]*')
            name=$(basename "$f" .xml | sed 's/^TEST-//')
            echo "$name: tests=${t} failures=${fl} errors=${er}"
            total=$((total + t)); failed=$((failed + fl + er))
          done
          echo "总计：${total} 个用例，${failed} 个失败"
          [ "$failed" -eq 0 ]

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Build Signed Release APK (R8 + Baseline Profile)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Resolve App Version
        id: app_version
        run: |
          # 从 Gradle 读取 versionName，避免 CI 中硬编码版本号导致与构建产物不一致
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to resolve versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "Resolved app version: v$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          VERSION="${{ steps.app_version.outputs.version }}"
          RELEASE_NAME="ITYou-v${VERSION}-release.apk"
          cp "$APK_SRC" "release_dist/$RELEASE_NAME"
          echo "apk_path=release_dist/$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "release_dist/$RELEASE_NAME" > "release_dist/$RELEASE_NAME.sha256"

      - name: Upload Release Artifact to Actions
        uses: actions/upload-artifact@v7
        with:
          name: ITYou-v${{ steps.app_version.outputs.version }}-release-apk
          path: release_dist/*
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v3
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-preview
          name: "ITYou v${{ steps.app_version.outputs.version }} (Pre-Release)"
          prerelease: true
          draft: false
          make_latest: false
          files: |
            release_dist/*
          body: |
            ## ITYou v${{ steps.app_version.outputs.version }} Pre-Release

            本版本为开启了 R8 代码混淆、资源紧缩优化及 Baseline Profile 预编译的正式签名版本。

            ### 🚀 本次更新要点
            - 🎨 **下拉刷新指示器**：改为胶囊形状 + 主色容器，与本应用形状语言统一；
            - 🐛 **修复刷新与触底加载并发**：游标竞争会导致文章重复或错乱，现已在协程外同步快照游标并加守卫；
            - 🔇 **修复静默失败**：列表非空时刷新失败此前无任何提示，现通过 SnackBar 反馈；
            - 🔁 **修复连点刷新**：快速连点会重复请求并把「更新了几篇」算错，现已在途刷新会被忽略；
            - 🔄 **下拉刷新**：首页支持下拉刷新手势，松手即拉取最新内容；
            - 🌀 **刷新旋转动效**：顶栏刷新按钮在刷新中匀速旋转，直观反馈进行状态；
            - 🔔 **刷新结果提示**：刷新完成后提示「已更新 N 篇文章」，无新内容时提示「已是最新内容」；
            - 🏷️ **版本号自动同步**：设置页版本号改为读取构建信息，不再硬编码。

            ### 📦 文件校验
            发布包包含已签名的正式 Release APK，附带 SHA-256 完整性校验文件。
