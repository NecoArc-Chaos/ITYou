name: Android CI & Pre-Release

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Pre-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully, size: $(wc -c < release.keystore) bytes"

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Build Signed Release APK (R8 + Baseline Profile)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          RELEASE_NAME="ITYou-v1.5.0-release.apk"
          cp "$APK_SRC" "release_dist/$RELEASE_NAME"
          echo "apk_path=release_dist/$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "release_dist/$RELEASE_NAME" > "release_dist/$RELEASE_NAME.sha256"

      - name: Upload Release Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ITYou-v1.5.0-release-apk
          path: release_dist/*
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0-preview
          name: "ITYou v1.5.0 (Pre-Release)"
          prerelease: true
          draft: false
          make_latest: false
          files: |
            release_dist/*
          body: |
            ## ITYou v1.5.0 Pre-Release

            本版本为开启了 R8 代码混淆、资源紧缩优化及 Baseline Profile 预编译的正式签名版本。

            ### 🚀 本次更新要点
            - 🔑 **独立正式签名打包**：采用 GitHub Actions Secrets 安全注入专用签名证书打出 Release APK；
            - 🎨 **默认字体更新**：集成「丸子黑体 (Maruko Gothic)」，赋予全应用典雅圆润的 MD3 Expressive 中文排版；
            - ⚙️ **系统字体切换**：设置页新增「使用系统字体」开关，随时自由回退至设备原生字型；
            - 📰 **相关文章推荐**：文章详情页底部完美解析并渲染「相关文章」卡片流，支持点选跳转深度阅读；
            - 🧹 **精简交互**：移除首页未实装的顶栏搜索按钮；
            - ⚡ **卡片等高与骨架屏契约对齐**：统一几何推导，彻底消除滑动抖动与结构漂移。

            ### 📦 文件校验
            发布包包含已签名的正式 Release APK，附带 SHA-256 完整性校验文件。
