name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Build Debug APK
        run: |
          gradle assembleDebug \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Build Release APK (R8 + Baseline Profile)
        run: |
          gradle assembleRelease \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ITYou-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ITYou-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 7
