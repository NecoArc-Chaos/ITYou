name: Android CI & Pre-Release

on:
  push:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Pre-Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9
          cache-read-only: false

      - name: Decode Release Keystore
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "Keystore decoded successfully, size: $(wc -c < release.keystore) bytes"

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Build Signed Release APK (R8 + Baseline Profile)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease \
            --parallel \
            --build-cache \
            --max-workers=4 \
            --no-daemon \
            --stacktrace

      - name: Resolve App Version
        id: app_version
        run: |
          # 从 Gradle 读取 versionName，避免 CI 中硬编码版本号导致与构建产物不一致
          APP_VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n 1)
          if [ -z "$APP_VERSION" ]; then
            echo "::error::Failed to resolve versionName from app/build.gradle.kts"
            exit 1
          fi
          echo "Resolved app version: v$APP_VERSION"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Artifacts
        id: prepare_artifacts
        run: |
          mkdir -p release_dist
          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi
          VERSION="${{ steps.app_version.outputs.version }}"
          RELEASE_NAME="ITYou-v${VERSION}-release.apk"
          cp "$APK_SRC" "release_dist/$RELEASE_NAME"
          echo "apk_path=release_dist/$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          echo "release_name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "release_dist/$RELEASE_NAME" > "release_dist/$RELEASE_NAME.sha256"

      - name: Upload Release Artifact to Actions
        uses: actions/upload-artifact@v4
        with:
          name: ITYou-v${{ steps.app_version.outputs.version }}-release-apk
          path: release_dist/*
          retention-days: 14

      - name: Publish GitHub Pre-Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.app_version.outputs.version }}-preview
          name: "ITYou v${{ steps.app_version.outputs.version }} (Pre-Release)"
          prerelease: true
          draft: false
          make_latest: false
          files: |
            release_dist/*
          body: |
            ## ITYou v${{ steps.app_version.outputs.version }} Pre-Release

            本版本为开启了 R8 代码混淆、资源紧缩优化及 Baseline Profile 预编译的正式签名版本。

            ### 🚀 本次更新要点
            - 💬 **文章评论区**：详情页新增真实评论流，含头像、昵称、地区楼层、时间与支持/反对数，正文支持长按选中复制；
            - 📄 **评论游标分页**：底部「加载更多评论」按评论 id 游标按需拉取更早的评论；
            - 🧵 **楼中楼回复**：回复默认折叠、一键展开，展示「回复 @某人」的引用关系；
            - 📥 **按需加载剩余回复**：服务端报告仍有未内联回复时，可点击「展开另外 N 条」补齐；
            - 🐛 **修复正文重复渲染**：PC 端页面结构导致的文章标题与「相关文章」标题重复出现问题；
            - 🔑 **独立正式签名打包**：采用 GitHub Actions Secrets 安全注入专用签名证书打出 Release APK；
            - 🎨 **默认字体更新**：集成「丸子黑体 (Maruko Gothic)」，赋予全应用典雅圆润的 MD3 Expressive 中文排版。

            ### 📦 文件校验
            发布包包含已签名的正式 Release APK，附带 SHA-256 完整性校验文件。
